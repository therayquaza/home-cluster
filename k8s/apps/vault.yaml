apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1" # after es
spec:
  project: default
  destination:
    name: in-cluster
    namespace: vault

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

  sources:
  - repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.34.1
    helm:
      releaseName: vault
      skipCrds: false
      values: |
        global:
          enabled: true
          namespace: vault
          tlsDisable: true

        injector:
          enabled: false

        server:
          enabled: true

          image:
            repository: hashicorp/vault
            tag: "2.1.1"
            pullPolicy: IfNotPresent

          # -------------------------------------------------------------------
          # Vault 2.x container guard: the 2.0 images run as an unprivileged
          # user and need IPC_LOCK to lock memory (mlock). No SKIP_SETCAP
          # override needed — chart 0.34.1 already sets SKIP_SETCAP=true
          # itself (duplicating it breaks ArgoCD's diff). Correct values
          # path is server.statefulSet.securityContext; the block replaces
          # the chart default, so restate allowPrivilegeEscalation.
          # -------------------------------------------------------------------
          statefulSet:
            securityContext:
              container:
                allowPrivilegeEscalation: false
                capabilities:
                  add:
                    - IPC_LOCK

          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: vault

          persistentVolumeClaimRetentionPolicy:
            whenDeleted: Retain
            whenScaled: Retain

          dataStorage:
            enabled: true
            size: 10Gi
            mountPath: /vault/data
            accessMode: ReadWriteOnce

          resources:
            requests:
              memory: 128Mi
              cpu: 200m
            limits:
              memory: 256Mi
              cpu: 300m

          standalone:
            enabled: true
            config: |
              ui = true
              listener "tcp" {
                tls_disable = 1
                address = "[::]:8200"
                cluster_address = "[::]:8201"
              }
              storage "file" {
                path = "/vault/data"
              }
              telemetry {
                disable_hostname = true
                prometheus_retention_time = "12h"
              }

          priorityClassName: "critical-resilient"

          ingress:
            enabled: false

          annotations:
            ad.datadoghq.com/vault.checks: |
              {
                "vault": {
                  "init_config": {},
                  "instances": [
                    {
                      "api_url": "http://%%host%%:8200/v1"
                    }
                  ]
                }
              }
            ad.datadoghq.com/vault.logs: |
              [
                {
                  "source": "vault",
                  "service": "vault"
                }
              ]

          ui:
            enabled: true
            serviceType: ClusterIP
            externalPort: 8200
            targetPort: 8200

  - repoURL: https://github.com/TheRayquaza/home-cluster.git
    targetRevision: main
    path: k8s/vault
