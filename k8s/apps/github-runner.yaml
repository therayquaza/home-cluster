apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: github-runner
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  destination:
    name: in-cluster
    namespace: actions-runner-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

  ignoreDifferences:
    - group: ""
      kind: ServiceAccount
      name: home-cluster-gha-rs-no-permission
      namespace: actions-runner-system
    - group: rbac.authorization.k8s.io
      kind: Role
      name: home-cluster-gha-rs-manager
      namespace: actions-runner-system
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
      name: home-cluster-gha-rs-manager
      namespace: actions-runner-system
    - group: actions.github.com
      kind: AutoscalingRunnerSet

  sources:
  - repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set-controller
    targetRevision: 0.14.2
    helm:
      releaseName: gha-runner-scale-set-controller
      values: |
        replicaCount: 1

        serviceAccount:
          create: true

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi

        podSecurityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]

  - repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.14.2
    helm:
      releaseName: home-cluster
      values: |
        githubConfigUrl: https://github.com/TheRayquaza/home-cluster

        runnerScaleSetName: home-cluster

        githubConfigSecret: github-token

        minRunners: 1
        maxRunners: 5

        template:
          spec:
            restartPolicy: Never
            serviceAccountName: home-cluster-gha-rs-no-permission
            initContainers:
              - name: init-dind-externals
                image: ghcr.io/actions/actions-runner:2.337.0
                command: ["cp"]
                args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
                volumeMounts:
                  - name: dind-externals
                    mountPath: /home/runner/tmpDir
              - name: dind
                image: docker:29.8.1-dind
                args:
                  - dockerd
                  - --host=unix:///var/run/docker.sock
                  - --group=$(DOCKER_GROUP_GID)
                env:
                  - name: DOCKER_GROUP_GID
                    value: "123"
                securityContext:
                  privileged: true
                restartPolicy: Always
                startupProbe:
                  exec:
                    command: ["docker", "info"]
                  initialDelaySeconds: 0
                  failureThreshold: 24
                  periodSeconds: 5
                volumeMounts:
                  - name: work
                    mountPath: /home/runner/_work
                  - name: dind-sock
                    mountPath: /var/run
                  - name: dind-externals
                    mountPath: /home/runner/externals
            containers:
              - name: runner
                image: ghcr.io/actions/actions-runner:2.337.0
                command: ["/home/runner/run.sh"]
                env:
                  - name: DOCKER_HOST
                    value: unix:///var/run/docker.sock
                  - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                    value: "120"
                volumeMounts:
                  - name: work
                    mountPath: /home/runner/_work
                  - name: dind-sock
                    mountPath: /var/run
            volumes:
              - name: work
                emptyDir: {}
              - name: dind-sock
                emptyDir: {}
              - name: dind-externals
                emptyDir: {}

        controllerServiceAccount:
          namespace: actions-runner-system
          name: gha-runner-scale-set-controller-gha-rs-controller

  - repoURL: https://github.com/TheRayquaza/home-cluster.git
    targetRevision: main
    path: k8s/github-runner
