---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app: cilium
spec:
  project: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
  destination:
    name: in-cluster
    namespace: kube-system
  sources:
    - repoURL: https://helm.cilium.io/
      chart: cilium
      targetRevision: 1.20.2
      helm:
        values: |
          # -------------------------------------------------------------------
          # Hubble Relay & UI
          # -------------------------------------------------------------------
          hubble:
            relay:
              enabled: true
            ui:
              enabled: true

          # -------------------------------------------------------------------
          # Gateway API
          # -------------------------------------------------------------------
          gatewayAPI:
            enabled: true

          # -------------------------------------------------------------------
          # L2 announcements — announce gateway LB VIPs on the LAN (ARP/GARP)
          # on the configured device. Required so the dedicated gateway VIP
          # 192.168.1.151 is reachable from the network once the router's
          # HTTP/S port-forward points at it instead of the host IP .38.
          # Note the chart key is lowercase "l2announcements" in 1.19.x+.
          # -------------------------------------------------------------------
          l2announcements:
            enabled: true

          # -------------------------------------------------------------------
          # kube-proxy replacement & Devices
          # -------------------------------------------------------------------
          kubeProxyReplacement: true
          k8sServiceHost: "10.20.0.1"
          k8sServicePort: "6443"

          # Restrict NodePort lookup so Cilium does not intercept UDP 51820
          nodePort:
            range: "30000,32767"

          # Prevent host socket interception for non-pod host daemons
          hostServices:
            hostNamespaceOnly: true

          # -------------------------------------------------------------------
          # BPF & datapath
          # -------------------------------------------------------------------
          bpf:
            masquerade: false
            # BPF masquerade disabled: Cilium's BPF datapath on eno1 black-holes
            # host SSH on this single-node box (lockout whenever BPF attaches to
            # the physical NIC). Falling back to iptables/NAT masquerade keeps
            # pod egress working while entirely decoupling it from BPF-on-eno1.
            # (kernel ip-masq-agent / iptables SNAT handles pod->internet.)
            hostRouting: false

          # Scope the datapath devices explicitly: only the physical uplink
          # (no interface churn from the tunnel devices being treated as
          # datapath interfaces).
          devices: "eno1"

          # -------------------------------------------------------------------
          # Host firewall — DISABLED.
          # Keep off: the legacy behavior caused host/loopback traffic drops.
          # Host firewall isn't needed on this single-node cluster.
          # -------------------------------------------------------------------
          hostFirewall:
            enabled: false

          # -------------------------------------------------------------------
          # DNS proxy — disable transparent (socket-level) DNS interception.
          # In transparent mode Cilium hijacks DNS queries at the eBPF socket
          # layer, recursively black-holing CoreDNS upstream lookups and
          # breaking pod/host resolution -> cert-manager ACME fails.
          # -------------------------------------------------------------------
          dnsProxy:
            enableTransparentMode: false

          # -------------------------------------------------------------------
          # Metrics & monitoring
          # -------------------------------------------------------------------
          monitor:
            enabled: true

          # -------------------------------------------------------------------
          # Operator
          # -------------------------------------------------------------------
          operator:
            replicas: 1
            nodeGCInterval: 5m

          # -------------------------------------------------------------------
          # Miscellaneous
          # -------------------------------------------------------------------
          priorityClassName: system-cluster-critical

    - repoURL: https://github.com/TheRayquaza/home-cluster.git
      targetRevision: HEAD
      path: k8s/cilium
