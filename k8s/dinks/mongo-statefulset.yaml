apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: dinks
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels: { app: dinks-mongo }
  template:
    metadata:
      labels: { app: dinks-mongo }
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: keyfile-perms
          image: mongo:8
          # k8s fsGroup adds group-read to secret-mounted files; mongod rejects
          # keyFile perms wider than 0600. Copy into the writable tmp emptyDir and chmod there.
          command: ["/bin/sh", "-c", "cp /etc/mongo-keyfile/keyfile /tmp/mongo-keyfile && chmod 600 /tmp/mongo-keyfile"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: mongo-keyfile, mountPath: /etc/mongo-keyfile, readOnly: true }
      containers:
        - name: mongo
          image: mongo:8
          # single-node replica set: required for the multi-document transaction used by DeleteMember
          args: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/tmp/mongo-keyfile"]
          ports: [{ containerPort: 27017 }]
          env:
            - { name: MONGO_INITDB_ROOT_USERNAME, value: dinks }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: dinks-secret, key: DB_PASSWORD } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: mongo-data, mountPath: /data/db }
            - { name: tmp, mountPath: /tmp }
            - { name: mongo-keyfile, mountPath: /etc/mongo-keyfile, readOnly: true }
          resources:
            requests: { memory: 128Mi, cpu: 100m }
            limits: { memory: 512Mi, cpu: 500m }
          startupProbe:
            # exec.command is NOT shell-expanded by kubelet ($(VAR) only works in container command/args) — use sh -c
            exec: { command: ["/bin/sh", "-c", "mongosh --quiet -u \"$MONGO_INITDB_ROOT_USERNAME\" -p \"$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")'"] }
            failureThreshold: 30
            periodSeconds: 3
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: ["/bin/sh", "-c", "mongosh --quiet -u \"$MONGO_INITDB_ROOT_USERNAME\" -p \"$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")'"] }
            periodSeconds: 10
            timeoutSeconds: 5
          lifecycle:
            postStart:
              exec:
                # single-node replica sets don't self-initiate; do it once, idempotently, after mongod is reachable
                command:
                  - /bin/sh
                  - -c
                  - |
                    export cmd="mongosh --quiet -u $MONGO_INITDB_ROOT_USERNAME -p $MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin"
                    until $cmd --eval 'db.adminCommand("ping")' >/dev/null 2>&1; do sleep 1; done
                    $cmd --eval 'try { rs.status() } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo-0.mongo.dinks.svc.cluster.local:27017"}]}) }'
      volumes:
        - name: mongo-data
          persistentVolumeClaim: { claimName: dinks-mongo-data }
        - name: tmp
          emptyDir: {}
        - name: mongo-keyfile
          secret: { secretName: dinks-secret, items: [{ key: MONGO_KEYFILE, path: keyfile, mode: 0400 }] }
