apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: systems-exception
  namespace: kyverno
spec:
  exceptions:
  - policyName: require-resource-limits
    ruleNames:
    - require-limits
    - autogen-require-limits
    - autogen-cronjob-require-limits
  - policyName: require-security-context
    ruleNames:
    - require-non-root
    - require-seccomp
    - require-drop-all-caps
    - require-no-privilege-escalation
    - autogen-require-non-root
    - autogen-require-seccomp
    - autogen-require-drop-all-caps
    - autogen-require-no-privilege-escalation
  - policyName: require-readonly-rootfs
    ruleNames:
    - require-readonly-rootfs
    - autogen-require-readonly-rootfs
  - policyName: disallow-host-path
    ruleNames:
    - disallow-host-path
    - autogen-disallow-host-path
  match:
    any:
    # kyverno clean-reports job has no resource limits in upstream chart
    - resources:
        namespaces: ["kyverno"]
    # local-path-provisioner: upstream runs as root (requires host path access).
    # No label selector: dynamically-created helper pods (helper-pod-create-pvc-*,
    # helper-pod-delete-pvc-*) don't carry the app.kubernetes.io/name label.
    - resources:
        kinds: ["Pod", "Deployment", "ReplicaSet", "StatefulSet"]
        namespaces: ["local-path-provisioner"]
    # trivy-operator: upstream chart runs as root to scan container images
    - resources:
        kinds: ["Pod", "Deployment", "ReplicaSet"]
        namespaces: ["trivy-system"]
        selector:
          matchLabels:
            app.kubernetes.io/name: trivy-operator
