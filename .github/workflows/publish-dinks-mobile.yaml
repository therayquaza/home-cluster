name: Publish - dinks-mobile

on:
  push:
    tags: ["dinks-mobile/v*"]
  workflow_dispatch:

concurrency:
  group: publish-dinks-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: [home-cluster]
    permissions:
      contents: write
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dinks/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci
        working-directory: apps/dinks

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
        working-directory: apps/dinks/mobile

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        working-directory: apps/dinks/mobile/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dinks-mobile-apk
          path: apps/dinks/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/dinks/mobile/android/app/build/outputs/apk/release/app-release.apk
