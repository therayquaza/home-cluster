name: Publish - dinks-mobile

on:
  push:
    tags: ["dinks-mobile/v*"]
  workflow_dispatch:

concurrency:
  group: publish-dinks-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: [home-cluster]
    permissions:
      contents: write
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/dinks/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install dependencies
        run: npm ci
        working-directory: apps/dinks

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
        working-directory: apps/dinks/mobile

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        working-directory: apps/dinks/mobile/android

      - name: Name APK after release version
        id: apk
        working-directory: apps/dinks/mobile
        run: |
          case "$GITHUB_REF_NAME" in
            dinks-mobile/v*) version="${GITHUB_REF_NAME#dinks-mobile/v}" ;;
            *) version="$(node -p "require('./app.json').expo.version")" ;;
          esac
          out="android/app/build/outputs/apk/release/dinks-${version}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$out"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "path=apps/dinks/mobile/$out" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: dinks-${{ steps.apk.outputs.version }}-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.apk.outputs.path }}
