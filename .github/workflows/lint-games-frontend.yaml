name: Lint - games-frontend

on:
  pull_request:
    paths:
      - apps/games/frontend/**
      - .github/workflows/lint-games-frontend.yaml
  push:
    branches:
      - main
    paths:
      - apps/games/frontend/**
      - .github/workflows/lint-games-frontend.yaml

jobs:
  typecheck:
    runs-on: [home-cluster]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/games/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/games/frontend

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: apps/games/frontend
