name: Template - Kubernetes Lint

on:
  workflow_call:

jobs:
  kubeconform:
    runs-on: [home-cluster]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install kubeconform
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate manifests
        run: |
          find k8s -name '*.yaml' -not -name 'kustomization.yaml' \
            | xargs kubeconform \
                -kubernetes-version 1.32.0 \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -ignore-missing-schemas \
                -summary

  kustomize-render:
    runs-on: [home-cluster]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install kustomize
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz \
            | tar xz -C "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Render all kustomize overlays
        run: |
          for dir in $(find k8s -name kustomization.yaml -printf '%h\n' | sort -u); do
            echo "rendering $dir"
            kustomize build "$dir" >/dev/null
          done

  kube-linter:
    runs-on: [home-cluster]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Run kube-linter
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/lint" \
            -w /lint \
            stackrox/kube-linter:latest \
            lint k8s --config .kube-linter.yaml