name: Renovate

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  renovate:
    runs-on: [home-cluster]
    steps:
      - uses: actions/checkout@v7
      - uses: renovatebot/github-action@v46.3.0
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: debug
          RENOVATE_REPOSITORIES: ${{ github.repository }}
