gzip              on;
gzip_vary         on;
gzip_min_length   1024;
gzip_proxied      any;
gzip_types        application/json
                  text/css
                  text/javascript
                  application/javascript
                  image/svg+xml;

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets never change under the same name.
  location /assets/ {
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The API is per-user and authenticated, so responses must never be cached by
  # an intermediary. The app already sets no-store; this makes it explicit for
  # the proxied paths too.
  location /api/ {
    proxy_pass http://dinks-backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /auth/ {
    proxy_pass http://dinks-backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
