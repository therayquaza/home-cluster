services:
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    healthcheck:
      # single-node dev replica set: self-initiate on first successful health check
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status() } catch (e) { rs.initiate() }\""]
      interval: 5s
      timeout: 5s
      retries: 10
  dinks-backend:
    build: ./backend
    environment:
      MONGO_URI: mongodb://mongo:27017/dinks?replicaSet=rs0
      MONGO_DB: dinks
      BASE_URL: http://localhost:8080
      JWT_SECRET: development-only-change-me
      DEV_AUTH: "true"
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: dinks-web
      OIDC_MOBILE_CLIENT_ID: dinks-mobile
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: http://localhost:8080/auth/callback
    depends_on:
      mongo:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports: ["8080:8080"]
    depends_on: [dinks-backend]
